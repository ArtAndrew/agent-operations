name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_operations
          POSTGRES_PASSWORD: integration_tests_only
          POSTGRES_DB: agent_operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Network PostgreSQL integration
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://agent_operations:integration_tests_only@127.0.0.1:5432/agent_operations_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser
      - run: pnpm test:e2e
      - name: Build the Python distribution
        run: python -m pip wheel --no-deps ./sdk/python -w /tmp/agent-operations-wheels
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t agent-operations:test .
      - name: Verify the image can serve the API and launch Chromium
        run: |
          AOP_SMOKE_TOKEN=$(openssl rand -hex 32)
          AOP_SMOKE_MASTER=$(openssl rand -hex 32)
          echo "::add-mask::$AOP_SMOKE_TOKEN"
          docker run -d --name agent-operations-smoke -p 127.0.0.1:4312:4300 -e ADMIN_TOKEN="$AOP_SMOKE_TOKEN" -e MASTER_KEY="$AOP_SMOKE_MASTER" agent-operations:test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4312/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4312/readyz
          curl --fail --silent --output /tmp/aop-workspace.json -X POST http://127.0.0.1:4312/api/v1/workspaces -H "Authorization: Bearer $AOP_SMOKE_TOKEN" -H "Content-Type: application/json" -d '{"name":"Container smoke test"}'
          node -e 'const fs=require("node:fs");if(!JSON.parse(fs.readFileSync("/tmp/aop-workspace.json")).token)process.exit(1)'
          docker exec agent-operations-smoke node --input-type=module -e 'import {chromium} from "playwright";const browser=await chromium.launch({headless:true});const page=await browser.newPage();await page.setContent("<h1>Browser ready</h1>");if(await page.locator("h1").innerText()!=="Browser ready")throw new Error("Browser check failed");await browser.close();'
      - name: Container logs
        if: failure()
        run: docker logs agent-operations-smoke || true
      - name: Clean up the smoke container
        if: always()
        run: docker rm -f agent-operations-smoke || true
