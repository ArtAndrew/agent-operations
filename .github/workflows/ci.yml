name: CI
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_operations
          POSTGRES_PASSWORD: integration_tests_only
          POSTGRES_DB: agent_operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Network PostgreSQL integration
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://agent_operations:integration_tests_only@127.0.0.1:5432/agent_operations_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser
      - run: pnpm test:e2e
      - name: Build the Python distribution
        run: python -m pip wheel --no-deps ./sdk/python -w /tmp/agent-operations-wheels
      - name: Install example frameworks
        run: python -m pip install ./sdk/python -r examples/integrations/requirements.txt
      - name: Test real framework integrations
        run: node scripts/test-integrations.mjs
      - name: Test Deep Agents in its own dependency environment
        run: |
          python -m venv /tmp/aop-deepagents
          /tmp/aop-deepagents/bin/python -m pip install ./sdk/python -r examples/integrations/requirements-deepagents.txt
          /tmp/aop-deepagents/bin/python -m unittest discover -s tests/integrations -p test_deepagents.py -v
        env:
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t agent-operations:test .
      - name: Verify the image can serve the API and launch Chromium
        run: bash scripts/container-smoke.sh agent-operations:test
