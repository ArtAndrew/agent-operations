name: Cloud provider pilot
description: Discuss offering managed Agent Operations to your customers.
title: "[Cloud pilot] "
body:
  - type: markdown
    attributes:
      value: "This is a public technical inquiry, not an order or license grant. Describe only information you can share publicly. Do not include secrets, customer data, private infrastructure addresses or confidential commercial terms."
  - type: textarea
    id: workflow
    attributes:
      label: Customer workflow
      description: Who would use the service, which external action would it perform, and what problem does the current process have?
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: Proposed deployment
      description: Describe the managed service you want to offer, the required integrations and your authentication or hosting requirements. Public details only.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Pilot acceptance criteria
      description: What would need to work for you to proceed? For example, recovery behavior, operator effort or an agreed workload.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed secrets and confidential information.
          required: true
